name: Build Vietnamese APK

# standalone revision: portable Gradle wrapper
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Vietnamese Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone Vietnamese branch
        uses: actions/checkout@v4
        with:
          ref: vietnamese-standalone

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Apply Vietnamese localization
        run: python3 tools/apply_vietnamese.py

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morealm-vietnamese-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Build Vietnamese APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Vietnamese Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone Vietnamese branch
        uses: actions/checkout@v4
        with:
          ref: vietnamese-standalone

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          validate-wrappers: false

      - name: Apply Vietnamese localization
        run: |
          python3 tools/apply_vietnamese.py
          sed -i "s/today's reading time/reading time for today/g" app/src/main/res/values-en/strings.xml

      - name: Work around missing upstream ZhLayout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/morealm/app/domain/render/ChapterProvider.kt")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(
              r'        val layout = if \(useZhLayout\) \{.*?\n'
              r'        \} else \{\n'
              r'            StaticLayout\(text, textPaint, visibleWidth, Layout\.Alignment\.ALIGN_NORMAL, 0f, 0f, true\)\n'
              r'        \}',
              re.DOTALL,
          )
          new = '''        val layout = StaticLayout(
              text,
              textPaint,
              visibleWidth,
              Layout.Alignment.ALIGN_NORMAL,
              0f,
              0f,
              true,
          )'''
          s2, count = pattern.subn(new, s, count=1)
          if count != 1:
              raise SystemExit(f"Expected one ZhLayout block, replaced {count}")
          p.write_text(s2, encoding="utf-8")
          print("Replaced missing ZhLayout with Android StaticLayout")
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morealm-vietnamese-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
